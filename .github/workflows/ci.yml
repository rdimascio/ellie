name: CI
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run format:check
      - run: bun run contracts:check
      - run: bun run typecheck
      - run: bun run test
  native_core:
    runs-on: macos-15
    timeout-minutes: 35
    outputs:
      head: ${{ steps.source.outputs.head }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native source revision
        id: source
        run: |
          head="$(git rev-parse HEAD)"
          test "$head" = "$GITHUB_SHA"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun run build:macos
      - name: Verify screen coordinate conversion and tiling
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library packages/macos/native/Geometry.swift tests/GeometryTests.swift -o "$RUNNER_TEMP/ellie-geometry-tests"
          "$RUNNER_TEMP/ellie-geometry-tests"
      - name: Test native dashboard models and persistence
        run: bun run desktop:test
      - name: Build and verify native dashboard app
        run: bun run desktop:build
      - name: Build native iPhone dashboard app
        run: bun run ios:build
  native_ios_ui:
    runs-on: macos-15
    # Keep the existing 20-minute UI suite deadline and leave bounded setup/cleanup time.
    timeout-minutes: 35
    outputs:
      head: ${{ steps.source.outputs.head }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native source revision
        id: source
        run: |
          head="$(git rev-parse HEAD)"
          test "$head" = "$GITHUB_SHA"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Test native iPhone dashboard app
        id: native_ios_ui
        env:
          ELLIE_IOS_KEEP_RESULT: "1"
        run: bun run ios:test
      - name: Preserve native iPhone UI result and appearance attachments
        if: ${{ always() && steps.native_ios_ui.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-iphone-test-result
          path: |
            test-results/native-ios.xcresult
            test-results/native-ios-runner-diagnostic.txt
          retention-days: 3
  native_ios_ats:
    runs-on: macos-15
    timeout-minutes: 35
    outputs:
      head: ${{ steps.source.outputs.head }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native source revision
        id: source
        run: |
          head="$(git rev-parse HEAD)"
          test "$head" = "$GITHUB_SHA"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Test native iPhone pinned HTTPS and Keychain
        id: native_ios_ats
        run: bun run test:ios-ats
      - name: Preserve native iPhone transport test evidence
        if: ${{ always() && steps.native_ios_ats.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-iphone-transport-test-result
          path: |
            test-results/native-ios-ats-summary.json
            test-results/native-ios-ats.xcresult
          retention-days: 3
  native:
    needs: [native_core, native_ios_ui, native_ios_ats]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every native check on this revision
        env:
          CORE_RESULT: ${{ needs.native_core.result }}
          UI_RESULT: ${{ needs.native_ios_ui.result }}
          ATS_RESULT: ${{ needs.native_ios_ats.result }}
          CORE_HEAD: ${{ needs.native_core.outputs.head }}
          UI_HEAD: ${{ needs.native_ios_ui.outputs.head }}
          ATS_HEAD: ${{ needs.native_ios_ats.outputs.head }}
        run: |
          test "$CORE_RESULT" = success
          test "$UI_RESULT" = success
          test "$ATS_RESULT" = success
          test "$CORE_HEAD" = "$GITHUB_SHA"
          test "$UI_HEAD" = "$GITHUB_SHA"
          test "$ATS_HEAD" = "$GITHUB_SHA"
  command-center:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run demo:build
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium webkit
      - run: bun run demo:test
      - run: bun run test:browser-media
      - name: Preserve browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 3
