name: CI
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run format:check
      - run: bun run contracts:check
      - run: bun run typecheck
      - run: bun run test
  native_core:
    runs-on: macos-15
    # The development package smoke below has its own 12-minute bound on top of the
    # previously measured native checks.
    timeout-minutes: 50
    outputs:
      head: ${{ steps.source.outputs.head }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native source revision
        id: source
        run: |
          head="$(git rev-parse HEAD)"
          test "$head" = "$GITHUB_SHA"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun run build:macos
      - name: Verify screen coordinate conversion and tiling
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library packages/macos/native/Geometry.swift tests/GeometryTests.swift -o "$RUNNER_TEMP/ellie-geometry-tests"
          "$RUNNER_TEMP/ellie-geometry-tests"
      - name: Test native dashboard models and persistence
        run: bun run desktop:test
      - name: Build and verify native dashboard app
        run: bun run desktop:build
      - name: Build and inspect development app with embedded runtime
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              node_arch="arm64"
              node_sha256="6239d4cf92d864487ec8cd3615038f7b67e7f58b77b21cd2f09ea9fbd68065fe"
              ;;
            x86_64)
              node_arch="x64"
              node_sha256="0ae5a24c24bb7d015cd816c5036b3f90f2945aa872fcf54e58da054753b3a299"
              ;;
            *)
              echo "Unsupported development package architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          node_archive="$RUNNER_TEMP/node-v24.21.0-darwin-$node_arch.tar.xz"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
            --output "$node_archive" \
            "https://nodejs.org/download/release/v24.21.0/$(basename "$node_archive")"
          printf '%s  %s\n' "$node_sha256" "$node_archive" | shasum -a 256 --check
          service_output="$RUNNER_TEMP/ellie-service-payload"
          bun_cache="$(bun pm cache)"
          test -d "$bun_cache"
          node scripts/build-service-payload.mjs \
            --node-archive "$node_archive" \
            --node-sha256 "$node_sha256" \
            --bun-cache "$bun_cache" \
            --output "$service_output"
          runtime="$service_output/EllieServices-0.1.0-dev-${GITHUB_SHA:0:8}-macos-$node_arch/payload"
          test -d "$runtime"
          node scripts/package-desktop.mjs --runtime "$runtime"
  native_ios:
    runs-on: macos-15
    # The UI runner permits 30 minutes; ATS follows on its warmed host with bounded cleanup.
    timeout-minutes: 60
    outputs:
      head: ${{ steps.source.outputs.head }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native source revision
        id: source
        run: |
          head="$(git rev-parse HEAD)"
          test "$head" = "$GITHUB_SHA"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build native iPhone dashboard app
        run: bun run ios:build
      - name: Initialize cold CoreSimulator runtime inventory
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          python3 - <<'PY'
          import subprocess
          import sys

          command = ["xcrun", "simctl", "list", "runtimes", "--json"]
          try:
              result = subprocess.run(
                  command, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE,
                  timeout=60, check=False,
              )
          except subprocess.TimeoutExpired as error:
              detail = (error.stderr or b"")[-2048:].decode("utf-8", "replace")
              print(f"CoreSimulator inventory timed out after 60s; stderr: {detail or '(empty)'}", file=sys.stderr)
              raise SystemExit(1)
          if result.returncode != 0:
              detail = result.stderr[-2048:].decode("utf-8", "replace")
              print(f"CoreSimulator inventory exited {result.returncode}; stderr: {detail or '(empty)'}", file=sys.stderr)
              raise SystemExit(1)
          PY
      - name: Test native iPhone dashboard app
        id: native_ios_ui
        env:
          ELLIE_IOS_KEEP_RESULT: "1"
        run: bun run ios:test
      - name: Preserve native iPhone UI result and appearance attachments
        if: ${{ always() && steps.native_ios_ui.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-iphone-test-result
          path: |
            test-results/native-ios.xcresult
            test-results/native-ios-runner-diagnostic.txt
          retention-days: 3
      - name: Test native iPhone pinned HTTPS and Keychain
        id: native_ios_ats
        run: bun run test:ios-ats
      - name: Preserve native iPhone transport test evidence
        if: ${{ always() && steps.native_ios_ats.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-iphone-transport-test-result
          path: |
            test-results/native-ios-ats-summary.json
            test-results/native-ios-ats.xcresult
          retention-days: 3
  native:
    needs: [native_core, native_ios]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every native check on this revision
        env:
          CORE_RESULT: ${{ needs.native_core.result }}
          IOS_RESULT: ${{ needs.native_ios.result }}
          CORE_HEAD: ${{ needs.native_core.outputs.head }}
          IOS_HEAD: ${{ needs.native_ios.outputs.head }}
        run: |
          test "$CORE_RESULT" = success
          test "$IOS_RESULT" = success
          test "$CORE_HEAD" = "$GITHUB_SHA"
          test "$IOS_HEAD" = "$GITHUB_SHA"
  command-center:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run demo:build
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium webkit
      - run: bun run demo:test
      - run: bun run test:browser-media
      - name: Preserve browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 3
